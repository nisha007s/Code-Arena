<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · Code Arena</title>
  <meta name="description" content="Code Arena: practise coding problems and race a friend in real time.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/pages/history.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/"><img class="brand-mark" src="/favicon.svg" alt=""> Code Arena</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/problems.html">Problems</a>
      <a href="/arena.html">Play a Friend</a>
      <a href="/history.html" aria-current="page">History</a>
    </nav>
    <span class="header-spacer"></span>
    <div class="guest-chip" id="guest-chip"><span class="muted">Loading…</span></div>
  </header>
  <div id="judge-banner" hidden></div>
  <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <main id="main" class="page">
    <h1>History</h1>
    <section aria-labelledby="matches-title" class="mt-4">
      <h2 id="matches-title">Matches</h2>
      <div id="matches"><p class="loading">Loading…</p></div>
    </section>
    <section aria-labelledby="subs-title" class="mt-4">
      <h2 id="subs-title">Submissions</h2>
      <p class="muted">Only your own submissions are shown. Opponents never see your code.</p>
      <div id="subs"><p class="loading">Loading…</p></div>
    </section>
  </main>
</body>
</html>
